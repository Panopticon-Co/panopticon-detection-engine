id: DET-WEB-003
name: Server-Side Request Forgery (SSRF) to Cloud Metadata Service
description: Detects web requests or application parameters attempting to query the link-local Cloud Instance Metadata Service (169.254.169.254) to steal IAM credentials.
version: 1
status: enabled
event_type: http_request

level: 15
severity: critical
confidence: 0.98

logic:
  any:
    - field: http.uri
      operator: contains
      value: "169.254.169.254"
    - field: http.body
      operator: contains
      value: "169.254.169.254"
    - field: network.destination_ip
      operator: equals
      value: "169.254.169.254"

evidence:
  - http.uri
  - http.body
  - network.destination_ip
  - network.source_ip

mitre:
  tactic: Credential Access
  technique: T1552.005
  name: "Unsecured Credentials: Cloud Instance Metadata API"

compliance:
  - PCI-DSS_6.5.1
  - OWASP_Top10_A10

tags:
  - attack.credential_access
  - ssrf
  - cloud_metadata
  - aws
  - gcp
