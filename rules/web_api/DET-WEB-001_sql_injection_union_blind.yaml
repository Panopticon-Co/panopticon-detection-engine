id: DET-WEB-001
name: Web Application SQL Injection Attack Payload Detected
description: Detects SQL injection attempts including UNION SELECT, boolean/time-based sleep payloads, and comment markers (-- or /*) in HTTP web requests.
version: 1
status: enabled
event_type: http_request

level: 14
severity: critical
confidence: 0.95

logic:
  any:
    - field: http.uri
      operator: regex
      value: "(?i)(union(\\s+all)?\\s+select|sleep\\(\\d+\\)|benchmark\\(|or\\s+1=1|waitfor\\s+delay)"
    - field: http.body
      operator: regex
      value: "(?i)(union(\\s+all)?\\s+select|sleep\\(\\d+\\)|benchmark\\(|or\\s+1=1|waitfor\\s+delay)"

evidence:
  - http.uri
  - http.method
  - http.body
  - network.source_ip

mitre:
  tactic: Initial Access
  technique: T1190
  name: "Exploit Public-Facing Application: SQL Injection"

compliance:
  - PCI-DSS_6.5.1
  - OWASP_Top10_A03

tags:
  - attack.initial_access
  - sqli
  - owasp
  - web_attack
