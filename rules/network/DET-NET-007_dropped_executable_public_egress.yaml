id: DET-NET-007
name: Recently Dropped Executable Connects to a Public Address
description: >
  A process whose image was written by another process within the last hour
  opens an outbound connection to a public IP address -- the shape of a
  downloaded payload calling home.
version: 1
status: enabled
event_type: network_connect

level: 13
severity: high
confidence: 0.85

logic:
  all:
    - field: network.direction
      operator: equals
      value: outbound
    - field: network.destination_scope
      operator: equals
      value: public
    - field: process.image_writer_name
      operator: exists
      value: true
    - field: process.image_age_seconds
      operator: less_than
      value: 3600

evidence:
  - process.name
  - process.executable
  - process.image_writer_name
  - network.destination_ip
  - network.destination_port
  - process.lineage

mitre:
  tactic: Command and Control
  technique: T1105
  name: "Ingress Tool Transfer: Dropped Payload Egress"

tags:
  - attack.command_and_control
  - provenance
  - dropped_payload
