id: DET-NET-008
name: TCP SYN Flood Denial of Service Exhaustion Attack
description: Detects rapid bursts of unacknowledged TCP SYN packets targeting single or multiple endpoints to exhaust connection state tables.
version: 1
status: enabled
event_type: network_traffic

level: 12
severity: high
confidence: 0.90

logic:
  all:
    - field: network.tcp_flags
      operator: in
      value:
        - SYN
        - 0x02

    - field: network.syn_packets_per_sec
      operator: greater_than
      value: 100

evidence:
  - network.destination_ip
  - network.destination_port
  - network.syn_packets_per_sec
  - network.source_ip

mitre:
  tactic: Impact
  technique: T1498.001
  name: "Network Denial of Service: Direct Network Flood - SYN Flood"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_SC-5

tags:
  - attack.impact
  - dos
  - syn_flood
