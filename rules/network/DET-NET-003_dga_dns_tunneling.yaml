id: DET-NET-003
name: Algorithmic DGA Domain Query or DNS Tunneling Exfiltration
description: Detects suspicious high-entropy DGA domains or DNS tunneling data exfiltration hidden inside subdomain query labels.
version: 1
status: enabled
event_type: dns_query

level: 13
severity: critical
confidence: 0.92

logic:
  any:
    - field: network.is_dga
      operator: equals
      value: true

    - field: network.is_dns_tunneling
      operator: equals
      value: true

evidence:
  - network.dns_query
  - network.domain_entropy
  - network.is_dga
  - network.is_dns_tunneling
  - process.name
  - process.pid

mitre:
  tactic: Command and Control
  technique: T1071.004
  name: "Application Layer Protocol: DNS C2 & Tunneling"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_SC-7

tags:
  - attack.command_and_control
  - attack.exfiltration
  - dga
  - dns_tunneling
