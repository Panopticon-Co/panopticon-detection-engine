id: DET-NET-005
name: Internal Horizontal Sweep From One Process
description: >
  One process connects out to at least ten distinct private addresses within a
  minute. Only internal destinations count, so a browser fanning out to CDNs
  does not look like a scan.
version: 1
status: enabled
type: value_count
by: process
event_type: network_connect
field: network.destination_ip
count: 10
window: 60s

level: 12
severity: high
confidence: 0.85

logic:
  all:
    - field: network.direction
      operator: equals
      value: outbound
    - field: network.destination_scope
      operator: equals
      value: private

evidence:
  - process.name
  - network.destination_port
  - process.lineage

mitre:
  tactic: Discovery
  technique: T1046
  name: "Network Service Discovery"

tags:
  - attack.discovery
  - port_scan
