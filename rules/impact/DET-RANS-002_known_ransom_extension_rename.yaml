id: DET-RANS-002
name: File Renamed to a Known Ransomware Extension
description: A file is renamed to an extension used by a known ransomware family.
version: 1
status: enabled
event_type: file_rename

level: 14
severity: critical
confidence: 0.9
active_response: TERMINATE_PROCESS

logic:
  all:
    - field: file.path
      operator: regex
      value: '\.(locked|crypto|wnry|wncry|crypted|locky|encrypted|mallox|lockbit|blackcat|alphv|akira|ryk)$'

evidence:
  - process.name
  - file.path
  - file.previous_path
  - process.lineage

mitre:
  tactic: Impact
  technique: T1486
  name: "Data Encrypted for Impact"

tags:
  - attack.impact
  - ransomware
