id: DET-IDENT-005
name: DCSync Active Directory Password Hash Replication Attempt
description: Detects non-Domain Controller accounts invoking Directory Replication Service Remote Protocol (MS-DRSR / DsGetNcChanges) to extract all domain password hashes.
version: 1
status: enabled
event_type: directory_service

level: 16
severity: critical
confidence: 0.98

logic:
  all:
    - field: action
      operator: in
      value:
        - DsGetNcChanges
        - DRSGetNCChanges
        - DirectoryReplication

    - field: user.is_domain_controller
      operator: not_equals
      value: true

evidence:
  - user.name
  - action
  - network.source_ip
  - host.name

mitre:
  tactic: Credential Access
  technique: T1003.006
  name: "OS Credential Dumping: DCSync Replication"

compliance:
  - PCI-DSS_10.2.1
  - NIST_800-53_IA-5

tags:
  - attack.credential_access
  - dcsync
  - active_directory
  - mimikatz
