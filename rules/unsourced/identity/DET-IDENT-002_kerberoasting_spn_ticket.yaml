id: DET-IDENT-002
name: Kerberoasting - Anomalous SPN Ticket Request with RC4 Encryption
description: Detects Kerberos Ticket Granting Service (TGS) requests for Service Principal Names (SPNs) utilizing legacy RC4 encryption for offline password cracking.
version: 1
status: enabled
event_type: kerberos_ticket

level: 14
severity: critical
confidence: 0.93

logic:
  all:
    - any:
        - field: kerberos.encryption_type
          operator: contains
          value: "0x17"
        - field: kerberos.encryption_type
          operator: contains
          value: rc4

evidence:
  - user.name
  - kerberos.service_name
  - kerberos.encryption_type
  - network.source_ip

mitre:
  tactic: Credential Access
  technique: T1558.003
  name: "Steal or Forge Kerberos Tickets: Kerberoasting"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_IA-5

tags:
  - attack.credential_access
  - kerberoasting
  - active_directory
