id: DET-IDENT-006
name: AS-REP Roasting - Kerberos Pre-Authentication Disabled Ticket Request
description: Detects Kerberos Authentication Service (AS-REQ) requests for user accounts configured with DONT_REQ_PREAUTH (Event 4768) used for offline password hash cracking.
version: 1
status: enabled
event_type: kerberos_ticket

level: 13
severity: high
confidence: 0.92

logic:
  all:
    - field: kerberos.preauth_type
      operator: in
      value:
        - "0"
        - "disabled"
        - "none"
        - "DONT_REQ_PREAUTH"

evidence:
  - user.name
  - kerberos.preauth_type
  - network.source_ip

mitre:
  tactic: Credential Access
  technique: T1558.004
  name: "Steal or Forge Kerberos Tickets: AS-REP Roasting"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_IA-5

tags:
  - attack.credential_access
  - asrep_roasting
  - active_directory
