id: DET-IDENT-009
name: Multi-Factor Authentication (MFA) Fatigue and Push Bombing
description: Detects rapid, high-volume successive MFA push notifications or verification prompts sent to a single user account within a short timeframe.
version: 1
status: enabled
event_type: mfa_prompt

level: 13
severity: high
confidence: 0.92

logic:
  all:
    - field: mfa.prompt_count
      operator: greater_than
      value: 5

    - field: mfa.status
      operator: in
      value:
        - denied_spammed
        - push_exhaustion
        - rapid_prompts

evidence:
  - user.name
  - mfa.prompt_count
  - mfa.provider
  - network.source_ip

mitre:
  tactic: Credential Access
  technique: T1621
  name: "Multi-Factor Authentication Request Generation: MFA Fatigue"

compliance:
  - PCI-DSS_8.3
  - NIST_800-53_IA-2

tags:
  - attack.credential_access
  - mfa_fatigue
  - push_bombing
