id: DET-IDENT-010
name: DCShadow Rogue Domain Controller Registration Attempt
description: Detects the registration of a rogue Domain Controller object (server and nTDSDSA objects in Configuration partition) to push unauthorized schema/GPO changes without logs.
version: 1
status: enabled
event_type: directory_service

level: 16
severity: critical
confidence: 0.98

logic:
  all:
    - field: action
      operator: in
      value:
        - DCShadowRegistration
        - RegisterRogueDC
        - nTDSDSA_Created

    - field: user.is_domain_controller
      operator: not_equals
      value: true

evidence:
  - user.name
  - action
  - host.name
  - network.source_ip

mitre:
  tactic: Persistence
  technique: T1207
  name: "Rogue Domain Controller: DCShadow"

compliance:
  - PCI-DSS_10.2.1
  - NIST_800-53_IA-5

tags:
  - attack.persistence
  - attack.defense_evasion
  - dcshadow
  - mimikatz
