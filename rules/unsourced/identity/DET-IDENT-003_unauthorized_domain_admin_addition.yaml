id: DET-IDENT-003
name: Unauthorized Account Added to Domain Admins Privileged Group
description: Detects directory changes where a user account is added to Domain Admins, Enterprise Admins, or Schema Admins indicating shadow admin persistence or privilege escalation.
version: 1
status: enabled
event_type: group_change

level: 15
severity: critical
confidence: 0.98

logic:
  all:
    - field: action
      operator: equals
      value: member_added

    - field: group.name
      operator: in
      value:
        - "Domain Admins"
        - "Enterprise Admins"
        - "Schema Admins"
        - "Administrators"

evidence:
  - user.name
  - group.name
  - action
  - user.acting_user

mitre:
  tactic: Persistence
  technique: T1098
  name: "Account Manipulation: Additional Cloud or Domain Roles"

compliance:
  - PCI-DSS_10.2.5
  - NIST_800-53_AC-2
  - ISO_27001_A.9.2.6

tags:
  - attack.persistence
  - attack.privilege_escalation
  - shadow_admin
  - domain_admins
