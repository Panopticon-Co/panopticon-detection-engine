id: DET-IDENT-012
name: Active Directory Group Policy Object (GPO) Modification or ACL Abuse
description: Detects unauthorized modification of Group Policy Objects (GPO files in SYSVOL / Policies), AdminSDHolder object ACL alterations, or granting GenericAll/WriteDacl over privileged AD containers.
version: 1
status: enabled
event_type: directory_service

level: 15
severity: critical
confidence: 0.96

logic:
  all:
    - any:
        - field: action
          operator: in
          value:
            - GPO_Modified
            - Set_AdminSDHolder_ACL
            - WriteDacl_Domain_Object
            - Grant_GenericAll
        - field: directory.target_object
          operator: contains
          value: "CN=AdminSDHolder"
        - field: directory.target_object
          operator: contains
          value: "\\Policies\\"

evidence:
  - user.name
  - action
  - directory.target_object
  - directory.granted_permissions

mitre:
  tactic: Privilege Escalation
  technique: T1484.001
  name: "Domain Policy Modification: Group Policy Modification"

compliance:
  - PCI-DSS_10.2.2
  - NIST_800-53_AC-2

tags:
  - attack.privilege_escalation
  - attack.persistence
  - gpo_abuse
  - adminsdholder
  - acl_abuse
