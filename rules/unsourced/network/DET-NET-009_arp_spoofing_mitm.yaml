id: DET-NET-009
name: ARP Spoofing and Man-in-the-Middle Cache Poisoning
description: Detects duplicate MAC address declarations or rapid gratuitous ARP replies attempting to poison local gateway ARP tables (Ettercap, Bettercap, Arpspoof).
version: 1
status: enabled
event_type: arp_event

level: 13
severity: high
confidence: 0.94

active_response: ISOLATE_HOST

logic:
  all:
    - field: arp.is_conflict
      operator: equals
      value: true

evidence:
  - arp.claimed_ip
  - arp.source_mac
  - arp.original_mac
  - network.source_ip

mitre:
  tactic: Credential Access
  technique: T1557.002
  name: "Adversary-in-the-Middle: ARP Poisoning"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_SC-7

tags:
  - attack.credential_access
  - mitm
  - arp_poisoning
