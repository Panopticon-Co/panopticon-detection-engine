id: DET-EXFIL-003
name: Data Exfiltration via USB Removable Media Drive
description: Detects mass file copy or writing operations targeting removable USB drive paths (E:\, F:\, /media/usb) from sensitive enterprise directories.
version: 1
status: enabled
event_type: file_write

level: 13
severity: high
confidence: 0.90

logic:
  all:
    - field: drive.type
      operator: in
      value:
        - Removable
        - USB
        - removable_disk

    - field: file.bytes_written
      operator: greater_than
      value: 10485760

evidence:
  - user.name
  - file.path
  - drive.type
  - file.bytes_written

mitre:
  tactic: Exfiltration
  technique: T1052.001
  name: "Exfiltration Over Physical Medium: Exfiltration to USB Drive"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_MP-7

tags:
  - attack.exfiltration
  - usb_theft
  - physical_medium
