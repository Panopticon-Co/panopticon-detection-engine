id: DET-CRED-005
name: SSH Private Key File Access or Credential Harvesting
description: Detects untrusted processes accessing or copying user SSH private keys (.ssh/id_rsa, .ssh/id_ed25519) to hijack remote server access.
version: 1
status: enabled
event_type: file_access

level: 14
severity: critical
confidence: 0.94

active_response: TERMINATE_PROCESS

logic:
  all:
    - field: process.name
      operator: not_in
      value:
        - ssh.exe
        - ssh
        - git.exe
        - git
        - putty.exe
        - pageant.exe

    - any:
        - field: file.path
          operator: contains
          value: ".ssh\\id_rsa"
        - field: file.path
          operator: contains
          value: ".ssh/id_rsa"
        - field: file.path
          operator: contains
          value: ".ssh\\id_ed25519"
        - field: file.path
          operator: contains
          value: ".ssh/id_ed25519"

evidence:
  - process.name
  - process.pid
  - file.path
  - process.user

mitre:
  tactic: Credential Access
  technique: T1552.004
  name: "Unsecured Credentials: Private Keys - SSH Key Theft"

compliance:
  - PCI-DSS_10.2.1
  - NIST_800-53_IA-5

tags:
  - attack.credential_access
  - ssh_keys
  - private_key_theft
