id: DET-INJ-004
name: Thread Execution Hijacking via SetThreadContext or QueueUserAPC
description: Detects inter-process thread manipulation using SetThreadContext or QueueUserAPC (Early Bird) to hijack suspended thread execution paths.
version: 1
status: enabled
event_type: thread_create

level: 15
severity: critical
confidence: 0.95

active_response: TERMINATE_PROCESS

