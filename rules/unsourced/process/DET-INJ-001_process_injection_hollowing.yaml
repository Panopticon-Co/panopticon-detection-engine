id: DET-INJ-001
name: Suspicious Process Injection or Hollowing into System Process
description: Detects memory injection, thread creation, or reflective DLL loading targeting core system binaries (svchost.exe, lsass.exe, spoolsv.exe, explorer.exe).
version: 1
status: enabled
event_type: process_injection

level: 15
severity: critical
confidence: 0.95

active_response: TERMINATE_PROCESS

logic:
  all:
    - field: target_process.name
      operator: in
      value:
        - svchost.exe
        - lsass.exe
        - spoolsv.exe
        - explorer.exe
        - winlogon.exe

    - field: injection_type
      operator: in
      value:
        - ProcessHollowing
        - CreateRemoteThread
        - NtQueueApcThread
        - ReflectiveDll

evidence:
  - source_process.name
  - source_process.pid
  - target_process.name
  - target_process.pid
  - injection_type

mitre:
  tactic: Defense Evasion
  technique: T1055.012
  name: "Process Injection: Process Hollowing"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_SI-4

tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - process_injection
  - memory_corruption
