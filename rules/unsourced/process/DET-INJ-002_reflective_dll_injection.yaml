id: DET-INJ-002
name: Reflective DLL Injection or In-Memory PE Loading
description: Detects process memory allocation with PAGE_EXECUTE_READWRITE permissions and reflective DLL loading markers in unbacked memory sections.
version: 1
status: enabled
event_type: memory_allocation

level: 15
severity: critical
confidence: 0.96

active_response: TERMINATE_PROCESS

logic:
  all:
    - field: memory.protection
      operator: in
      value:
        - PAGE_EXECUTE_READWRITE
        - 0x40
        - rwx

    - field: memory.is_unbacked
      operator: equals
      value: true

evidence:
  - process.name
  - process.pid
  - memory.protection
  - memory.allocated_bytes

mitre:
  tactic: Defense Evasion
  technique: T1055.001
  name: "Process Injection: Dynamic-link Library Injection - Reflective Loading"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_SI-4

tags:
  - attack.defense_evasion
  - attack.privilege_escalation
  - reflective_dll
  - process_injection
