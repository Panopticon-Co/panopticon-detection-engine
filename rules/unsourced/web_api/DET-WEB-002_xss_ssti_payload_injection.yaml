id: DET-WEB-002
name: Web Application Cross-Site Scripting (XSS) or SSTI Injection
description: Detects HTML/JavaScript injection (<script>, onerror=, javascript:) and Server-Side Template Injection ({{7*7}}, ${T(java.lang)}) in web parameters.
version: 1
status: enabled
event_type: http_request

level: 12
severity: high
confidence: 0.90

logic:
  any:
    - field: http.uri
      operator: regex
      value: "(?i)(<script|onerror\\s*=|javascript:|alert\\(|\\{\\{.*\\}\\}|\\$\\{.*\\})"
    - field: http.body
      operator: regex
      value: "(?i)(<script|onerror\\s*=|javascript:|alert\\(|\\{\\{.*\\}\\}|\\$\\{.*\\})"

evidence:
  - http.uri
  - http.body
  - network.source_ip

mitre:
  tactic: Initial Access
  technique: T1190
  name: "Exploit Public-Facing Application: XSS and Template Injection"

compliance:
  - PCI-DSS_6.5.7
  - OWASP_Top10_A03

tags:
  - attack.initial_access
  - xss
  - ssti
  - web_attack
