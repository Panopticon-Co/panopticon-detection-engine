id: DET-API-001
name: GraphQL Introspection Query and Schema Enumeration
description: Detects GraphQL queries containing __schema, __type, or full schema introspection payloads used by attackers to map hidden API endpoints.
version: 1
status: enabled
event_type: http_request

level: 11
severity: medium
confidence: 0.88

logic:
  any:
    - field: http.body
      operator: regex
      value: "(?i)(__schema|__type\\s*\\(|IntrospectionQuery)"
    - field: http.uri
      operator: regex
      value: "(?i)(__schema|__type|IntrospectionQuery)"

evidence:
  - http.uri
  - http.body
  - network.source_ip

mitre:
  tactic: Discovery
  technique: T1190
  name: "Exploit Public-Facing Application: GraphQL Introspection"

compliance:
  - OWASP_API_Top10_API7

tags:
  - attack.discovery
  - api
  - graphql
