id: DET-WEB-004
name: Path Traversal and Local File Inclusion (LFI) Attempt
description: Detects directory traversal patterns (../, ..\\, %2e%2e%2f) attempting to access sensitive system files like /etc/passwd or win.ini.
version: 1
status: enabled
event_type: http_request

level: 13
severity: high
confidence: 0.92

logic:
  any:
    - field: http.uri
      operator: regex
      value: "(?i)(\\.\\./|\\.\\.\\\\|%2e%2e|etc/passwd|win\\.ini|boot\\.ini)"
    - field: http.body
      operator: regex
      value: "(?i)(\\.\\./|\\.\\.\\\\|%2e%2e|etc/passwd|win\\.ini|boot\\.ini)"

evidence:
  - http.uri
  - http.body
  - network.source_ip

mitre:
  tactic: Discovery
  technique: T1083
  name: "File and Directory Discovery: Path Traversal"

compliance:
  - OWASP_Top10_A01

tags:
  - attack.discovery
  - path_traversal
  - lfi
