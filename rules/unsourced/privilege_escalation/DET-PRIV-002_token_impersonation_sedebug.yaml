id: DET-PRIV-002
name: Access Token Elevation and SeDebugPrivilege Abuse
description: Detects process token manipulation enabling SeDebugPrivilege, SeImpersonatePrivilege, or SeAssignPrimaryToken to impersonate SYSTEM tokens.
version: 1
status: enabled
event_type: token_privilege

level: 14
severity: critical
confidence: 0.94

active_response: TERMINATE_PROCESS

logic:
  all:
    - field: token.enabled_privilege
      operator: in
      value:
        - SeDebugPrivilege
        - SeImpersonatePrivilege
        - SeAssignPrimaryTokenPrivilege
        - SeTcbPrivilege

    - field: user.is_elevated_admin
      operator: not_equals
      value: true

evidence:
  - process.name
  - process.pid
  - user.name
  - token.enabled_privilege

mitre:
  tactic: Privilege Escalation
  technique: T1134.001
  name: "Access Token Manipulation: Token Impersonation/Theft"

compliance:
  - PCI-DSS_10.2.2
  - NIST_800-53_AC-6

tags:
  - attack.privilege_escalation
  - token_impersonation
  - sedebugprivilege
