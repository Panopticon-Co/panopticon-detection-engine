id: DET-PERS-009
name: Accessibility Feature Sticky Keys Backdoor Abuse
description: Detects the replacement of sethc.exe, utilman.exe, osk.exe, or Magnify.exe with cmd.exe or powershell.exe to obtain unauthenticated SYSTEM shells at logon screen.
version: 1
status: enabled
event_type: file_modify

level: 16
severity: critical
confidence: 0.98

active_response: TERMINATE_PROCESS

logic:
  any:
    - field: file.path
      operator: contains
      value: "system32\\sethc.exe"
    - field: file.path
      operator: contains
      value: "system32\\utilman.exe"
    - field: file.path
      operator: contains
      value: "system32\\osk.exe"

evidence:
  - process.name
  - file.path
  - process.pid
  - process.user

mitre:
  tactic: Persistence
  technique: T1546.008
  name: "Event Triggered Execution: Accessibility Features - Sticky Keys"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_SI-4

tags:
  - attack.persistence
  - attack.privilege_escalation
  - sticky_keys
  - sethc
