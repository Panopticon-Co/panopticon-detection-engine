id: DET-PERS-008
name: WMI Permanent Event Subscription Persistence
description: Detects the registration of permanent WMI Event Consumers (__EventFilter / CommandLineEventConsumer / ActiveScriptEventConsumer) to establish stealthy persistence.
version: 1
status: enabled
event_type: wmi_subscription

level: 14
severity: critical
confidence: 0.95

active_response: TERMINATE_PROCESS

logic:
  any:
    - field: wmi.consumer_type
      operator: in
      value:
        - CommandLineEventConsumer
        - ActiveScriptEventConsumer
        - LogFileEventConsumer
    - field: process.command_line
      operator: contains
      value: "CommandLineEventConsumer"

evidence:
  - process.name
  - wmi.consumer_type
  - wmi.filter_name
  - wmi.command_line_template

mitre:
  tactic: Persistence
  technique: T1546.003
  name: "Event Triggered Execution: Windows Management Instrumentation Event Subscription"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_SI-4

tags:
  - attack.persistence
  - attack.privilege_escalation
  - wmi_persistence
