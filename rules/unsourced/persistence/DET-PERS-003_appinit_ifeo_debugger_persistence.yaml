id: DET-PERS-003
name: Image File Execution Options (IFEO) or AppInit_DLLs Persistence
description: Detects registry modifications to 'Image File Execution Options' (Debugger value) or 'AppInit_DLLs' to hijack process execution and achieve persistence.
version: 1
status: enabled
event_type: registry_modify

level: 14
severity: critical
confidence: 0.95

active_response: TERMINATE_PROCESS

logic:
  any:
    - field: registry.key_path
      operator: contains
      value: "Image File Execution Options"
    - field: registry.key_path
      operator: contains
      value: "AppInit_DLLs"

evidence:
  - process.name
  - process.pid
  - registry.key_path
  - registry.value_name
  - registry.value_data

mitre:
  tactic: Persistence
  technique: T1546.012
  name: "Event Triggered Execution: Image File Execution Options Injection"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_SI-4

tags:
  - attack.persistence
  - attack.privilege_escalation
  - ifeo
  - appinit
