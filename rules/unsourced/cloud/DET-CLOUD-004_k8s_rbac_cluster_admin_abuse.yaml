id: DET-CLOUD-004
name: Kubernetes RBAC ClusterRoleBinding to Cluster-Admin Abuse
description: Detects the creation or modification of Kubernetes ClusterRoleBinding granting cluster-admin privileges to anonymous users, unauthenticated groups, or default service accounts.
version: 1
status: enabled
event_type: k8s_audit

level: 15
severity: critical
confidence: 0.96

logic:
  all:
    - field: k8s.verb
      operator: in
      value:
        - create
        - patch
        - update

    - field: k8s.role_ref
      operator: equals
      value: cluster-admin

    - any:
        - field: k8s.subject_kind
          operator: in
          value:
            - ServiceAccount
            - Group
            - User
        - field: k8s.subject_name
          operator: in
          value:
            - default
            - system:anonymous
            - system:unauthenticated

evidence:
  - user.name
  - k8s.verb
  - k8s.role_ref
  - k8s.subject_name

mitre:
  tactic: Privilege Escalation
  technique: T1078.004
  name: "Valid Accounts: Cloud / Kubernetes RBAC Cluster Admin Escalation"

compliance:
  - PCI-DSS_10.2.2
  - NIST_800-53_AC-6

tags:
  - attack.privilege_escalation
  - kubernetes
  - rbac_escalation
  - cluster_admin
