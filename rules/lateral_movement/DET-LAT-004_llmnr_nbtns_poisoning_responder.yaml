id: DET-LAT-004
name: LLMNR / NBT-NS / mDNS Name Resolution Poisoning (Responder)
description: Detects rapid unauthorized multicast/broadcast name resolution spoofing (UDP 5355 / 137 / 5353) designed to capture NetNTLMv2 challenge-response hashes.
version: 1
status: enabled
event_type: network_traffic

level: 13
severity: high
confidence: 0.94

logic:
  all:
    - field: network.destination_port
      operator: in
      value:
        - 5355
        - 137
        - 5353

    - field: network.is_unsolicited_response
      operator: equals
      value: true

evidence:
  - network.source_ip
  - network.destination_port
  - network.protocol

mitre:
  tactic: Credential Access
  technique: T1557.001
  name: "Adversary-in-the-Middle: LLMNR/NBT-NS Poisoning and SMB Relay"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_SC-7

tags:
  - attack.credential_access
  - attack.lateral_movement
  - responder
  - llmnr_poisoning
