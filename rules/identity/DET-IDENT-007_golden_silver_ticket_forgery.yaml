id: DET-IDENT-007
name: Kerberos Golden or Silver Ticket Forgery Detected
description: Detects forged Kerberos Ticket Granting Tickets (TGT) or Service Tickets (TGS) exhibiting abnormal lifetime (e.g. > 10 hours) or mismatched PAC verification.
version: 1
status: enabled
event_type: kerberos_ticket

level: 16
severity: critical
confidence: 0.98

logic:
  all:
    - any:
        - field: kerberos.ticket_lifetime_hours
          operator: greater_than
          value: 24
        - field: kerberos.pac_signature_valid
          operator: equals
          value: false

evidence:
  - user.name
  - kerberos.service_name
  - kerberos.ticket_lifetime_hours
  - network.source_ip

mitre:
  tactic: Credential Access
  technique: T1558.001
  name: "Steal or Forge Kerberos Tickets: Golden and Silver Ticket"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_IA-5

tags:
  - attack.credential_access
  - golden_ticket
  - silver_ticket
  - active_directory
