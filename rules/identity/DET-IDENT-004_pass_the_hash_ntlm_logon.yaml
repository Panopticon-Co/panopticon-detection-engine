id: DET-IDENT-004
name: Pass-The-Hash Remote NTLM Authentication
description: Detects suspicious remote NTLM authentication (Logon Type 3 or 9) without prior Kerberos authentication indicating stolen NTLM password hash reuse.
version: 1
status: enabled
event_type: user_login

level: 13
severity: high
confidence: 0.90

logic:
  all:
    - field: auth.package
      operator: equals
      value: NTLM

    - field: auth.logon_type
      operator: in
      value:
        - 3
        - 9
        - Network
        - NewCredentials

    - field: auth.status
      operator: equals
      value: success

evidence:
  - user.name
  - auth.package
  - auth.logon_type
  - network.source_ip

mitre:
  tactic: Lateral Movement
  technique: T1550.002
  name: "Use Alternate Authentication Material: Pass the Hash"

compliance:
  - PCI-DSS_8.3
  - NIST_800-53_IA-2

tags:
  - attack.lateral_movement
  - attack.defense_evasion
  - pass_the_hash
  - ntlm
