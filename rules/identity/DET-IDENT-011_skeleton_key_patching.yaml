id: DET-IDENT-011
name: Skeleton Key In-Memory Authentication Driver Patching
description: Detects in-memory modification or hooking of LSASS Kerberos authentication package on Domain Controllers creating a master backdoor password (Skeleton Key).
version: 1
status: enabled
event_type: lsass_hook

level: 16
severity: critical
confidence: 0.98

logic:
  all:
    - field: memory.target_process
      operator: equals
      value: lsass.exe

    - field: memory.is_hooked
      operator: equals
      value: true

evidence:
  - process.name
  - memory.target_process
  - host.name
  - memory.hook_type

mitre:
  tactic: Persistence
  technique: T1556
  name: "Modify Authentication Process: Skeleton Key"

compliance:
  - PCI-DSS_10.2.1
  - NIST_800-53_IA-5

tags:
  - attack.persistence
  - skeleton_key
  - lsass_patch
