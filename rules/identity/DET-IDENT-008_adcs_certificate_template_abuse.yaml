id: DET-IDENT-008
name: Active Directory Certificate Services (AD CS) Template Abuse
description: Detects certificate enrollments requesting Client Authentication with user-specified Subject Alternative Name (SAN / ESC1) enabling instant domain administrator impersonation.
version: 1
status: enabled
event_type: certificate_request

level: 15
severity: critical
confidence: 0.96

logic:
  all:
    - field: certificate.san_specified
      operator: equals
      value: true

    - field: certificate.template_flags
      operator: contains
      value: "ENROLLEE_SUPPLIES_SUBJECT"

evidence:
  - user.name
  - certificate.template_name
  - certificate.requested_san
  - network.source_ip

mitre:
  tactic: Privilege Escalation
  technique: T1649
  name: "Steal or Forge Authentication Certificates: AD CS Abuse"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_AC-2

tags:
  - attack.privilege_escalation
  - adcs
  - certipy
  - shadow_credentials
