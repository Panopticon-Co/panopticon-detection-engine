id: DET-IDENT-001
name: Distributed Password Spraying or High-Velocity Brute Force
description: Detects credential stuffing, password spraying across multiple user accounts, or rapid authentication failures targeting enterprise accounts.
version: 1
status: enabled
event_type: authentication

level: 13
severity: high
confidence: 0.95

logic:
  all:
    - field: auth.status
      operator: in
      value:
        - failure
        - failed
        - denied

evidence:
  - auth.status
  - auth.source_ip
  - user.name
  - host.name

mitre:
  tactic: Credential Access
  technique: T1110.003
  name: "Brute Force: Password Spraying"

compliance:
  - PCI-DSS_8.1.6
  - NIST_800-53_AC-7
  - ISO_27001_A.9.4.2

tags:
  - attack.credential_access
  - brute_force
  - password_spray
  - identity
