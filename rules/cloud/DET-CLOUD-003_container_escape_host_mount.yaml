id: DET-CLOUD-003
name: Container Workload Escape via Privileged Host Path Mount
description: Detects Kubernetes pods or Docker containers executing in privileged mode with direct host root or docker.sock mounts indicating container breakout.
version: 1
status: enabled
event_type: k8s_container

level: 15
severity: critical
confidence: 0.96

logic:
  all:
    - field: container.privileged
      operator: equals
      value: true

    - any:
        - field: container.host_mount
          operator: contains
          value: /docker.sock
        - field: container.host_mount
          operator: contains
          value: /host
        - field: container.host_mount
          operator: contains
          value: /proc

evidence:
  - container.pod_name
  - container.image
  - container.host_mount
  - container.privileged

mitre:
  tactic: Privilege Escalation
  technique: T1611
  name: "Escape to Host: Privileged Container Breakout"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_AC-6
  - ISO_27001_A.9.4.4

tags:
  - attack.privilege_escalation
  - container_escape
  - kubernetes
