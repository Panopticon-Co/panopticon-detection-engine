id: DET-CLOUD-001
name: Cloud IAM Backdoor Access Key Created
description: Detects the programmatic creation of AWS/GCP IAM access keys or Azure AD credentials by an existing identity to establish cloud persistence.
version: 1
status: enabled
event_type: cloud_audit

level: 14
severity: critical
confidence: 0.95

logic:
  all:
    - field: action
      operator: in
      value:
        - CreateAccessKey
        - create_service_account_key
        - New-AzureADMSApplicationKeyCredential

evidence:
  - user.name
  - action
  - cloud.account_id
  - network.source_ip

mitre:
  tactic: Persistence
  technique: T1098.001
  name: "Account Manipulation: Additional Cloud Credentials"

compliance:
  - PCI-DSS_10.2.5
  - NIST_800-53_AC-2
  - ISO_27001_A.9.2.6

tags:
  - attack.persistence
  - cloud.aws
  - cloud.gcp
  - iam
