id: DET-CLOUD-002
name: Cloud Storage Bucket Public Exposure or Data Leak Policy
description: Detects S3 or GCS bucket permission changes granting public anonymous read/write access (AllUsers, 0.0.0.0/0) enabling mass data leakage.
version: 1
status: enabled
event_type: cloud_storage

level: 15
severity: critical
confidence: 0.98

logic:
  all:
    - field: action
      operator: in
      value:
        - PutBucketAcl
        - PutBucketPolicy
        - setBucketIamPolicy

    - any:
        - field: storage.permissions
          operator: contains
          value: public-read
        - field: storage.permissions
          operator: contains
          value: allUsers
        - field: storage.permissions
          operator: contains
          value: anonymous

evidence:
  - user.name
  - storage.bucket_name
  - storage.permissions
  - cloud.account_id

mitre:
  tactic: Exfiltration
  technique: T1530
  name: "Data from Cloud Storage: Public Bucket Exposure"

compliance:
  - PCI-DSS_10.6
  - NIST_800-53_SC-7
  - ISO_27001_A.13.1

tags:
  - attack.exfiltration
  - cloud.storage
  - s3_leak
