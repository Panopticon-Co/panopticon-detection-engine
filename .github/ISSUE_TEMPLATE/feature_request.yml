name: Feature Request
description: Suggest a new detection rule, capability, or enhancement for eyedetect
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve eyedetect!
  - type: textarea
    id: problem
    attributes:
      label: Problem / Gap
      description: What threat, technique, or workflow gap prompted this request?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: New rule, MITRE technique coverage, correlation logic, or other change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require this repo to execute a real response action (that belongs in panopticon-response-engine / panopticon-manager)
          required: true
