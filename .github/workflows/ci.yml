name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Gate first: a rule that cannot fire is not coverage, it is a claim.
      # See scripts/check_rule_sourcing.py and finding F2.
      - name: Rule sourcing gate
        run: python scripts/check_rule_sourcing.py

      - name: Tests
        run: pytest -q

      - name: Smoke - batch replay
        run: |
          panopticon-detect --rules rules \
            --telemetry samples/master_full_spectrum_simulation.ndjson \
            --output-format ndjson --graph-stats

      # Real agent-shaped telemetry: exercises the provenance graph and the
      # campaign traversal, which the flat legacy sample above cannot.
      - name: Smoke - agent telemetry and provenance correlation
        run: |
          panopticon-detect --rules rules \
            --officer-ndjson samples/officer_live_sample.ndjson \
            --output-format ndjson --graph-stats

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check panopticon_detection scripts tests
