[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panopticon-detection-engine"
version = "2.0.0"
description = "Rule, provenance-correlation and behavioral detection engine for the Panopticon EDR platform"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["pyyaml>=6.0.1", "pydantic>=2.0.0"]

[project.optional-dependencies]
# jsonschema: tests validate dataset-adapter output against the agent's
# authoritative event.schema.json. Dev-only; the engine never imports it.
dev = ["pytest>=8.0.0", "pytest-cov", "ruff", "jsonschema>=4.20.0"]

[project.scripts]
panopticon-detect = "panopticon_detection.cli:main"
panopticon-dataset = "panopticon_detection.datasets.cli:main"

[tool.setuptools.packages.find]
include = ["panopticon_detection*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pydantic.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pinned explicitly so a ruff upgrade cannot silently widen CI. Pyflakes
# (real bugs), pycodestyle errors, and import ordering. The pyupgrade (UP*)
# modernization rules are deliberately out of scope for now: they would rewrite
# ~380 type annotations across legacy modules, which is churn unrelated to any
# behaviour and would bury a real diff.
select = ["E", "F", "I"]
ignore = ["E501"]  # line length is checked by the formatter, not the linter
